appId: com.example.centibot
productName: Centibot
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - node_modules/**
  - "!node_modules/.cache/**"
  - "!**/*.md"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/tsconfig.json"
  - "!**/jsconfig.json"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/.github/**"
  - "!**/.yarn/**"
  - "!node_modules/@types/**"
asar: true
asarUnpack:
  - node_modules/@lancedb/**/*.node
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Centibot
  uninstallDisplayName: Centibot
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - deb
    - zip
  icon: build/icon.png
electronDist: node_modules/electron/dist
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
